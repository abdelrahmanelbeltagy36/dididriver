name: بناء APK الأندرويد

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'deploy/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: تثبيت المكتبات
        run: npm install

      - name: بناء APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error::$(grep -iE 'FAILURE|What went wrong|Caused by|error:|Could not|SDK location|License' build.log | head -25 | tr '\n' ' ')"
            exit $code
          fi

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: dididriver-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
