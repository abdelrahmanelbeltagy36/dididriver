name: تذكير عداد العربية (FCM)

on:
  schedule:
    # كل ساعة — السكربت بيشيك على وقت القاهرة ويبعت بس الساعة 10 و4
    - cron: '0 * * * *'
  workflow_dispatch: # عشان تقدر تجرّبه يدويًا من تبويب Actions
    inputs:
      force_test:
        description: 'ابعت إشعار اختبار دلوقتي (بغض النظر عن الوقت)'
        required: false
        default: false
        type: boolean

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: FCM push
        run: node fcm/push-sender.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FORCE_SEND: ${{ inputs.force_test }}
